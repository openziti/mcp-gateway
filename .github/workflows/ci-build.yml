name: CI Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

# cancel older, redundant builds that haven't started yet
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build Linux AMD64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: build and install binaries
        shell: bash
        run: |
          module="github.com/openziti/mcp-gateway"
          version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          hash="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go install -ldflags "-s -w \
            -X ${module}/build.Version=${version} \
            -X ${module}/build.Hash=${hash} \
            -X ${module}/build.Date=${date} \
            -X ${module}/build.BuiltBy=github-actions" ./...

      - name: test and vet
        shell: bash
        run: |
          go test ./... -count=1
          go vet ./...

      - name: solve GOBIN
        id: solve_go_bin
        shell: bash
        run: |
          echo DEBUG: go_path="$(go env GOPATH)"
          echo go_bin="$(go env GOPATH)/bin" >> $GITHUB_OUTPUT

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            ${{ steps.solve_go_bin.outputs.go_bin }}/mcp-gateway
            ${{ steps.solve_go_bin.outputs.go_bin }}/mcp-bridge
            ${{ steps.solve_go_bin.outputs.go_bin }}/mcp-tools
          if-no-files-found: error
