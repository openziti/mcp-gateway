name: CI Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

# cancel older, redundant builds that haven't started yet
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build Linux AMD64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: fetch push ci scripts
        run: git clone --branch v0.2.1 --depth 1 https://github.com/michaelquigley/push.git _push

      - name: build and install binaries
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          LDFLAGS=$(_push/ci/ldflags.sh)
          go install -ldflags "${LDFLAGS}" ./...

      - name: verify stamp
        shell: bash
        run: |
          out=$("$(go env GOPATH)/bin/mcp-gateway" version)
          if [ -z "${out}" ] || printf '%s\n' "${out}" | grep -F '[developer build]'; then
            printf '%s\n' "${out}"
            exit 1
          fi

      - name: test and vet
        shell: bash
        run: |
          go test ./... -count=1
          go vet ./...

      - name: solve GOBIN
        id: solve_go_bin
        shell: bash
        run: |
          echo DEBUG: go_path="$(go env GOPATH)"
          echo go_bin="$(go env GOPATH)/bin" >> $GITHUB_OUTPUT

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            ${{ steps.solve_go_bin.outputs.go_bin }}/mcp-gateway
            ${{ steps.solve_go_bin.outputs.go_bin }}/mcp-bridge
            ${{ steps.solve_go_bin.outputs.go_bin }}/mcp-tools
          if-no-files-found: error
