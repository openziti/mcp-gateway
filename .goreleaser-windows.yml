version: 2
builds:
- id: mcp-gateway-windows
  main: ./cmd/mcp-gateway
  binary: mcp-gateway
  ldflags:
    - -s -w
    - -X github.com/michaelquigley/push/build.Version={{.Tag}}
    - -X github.com/michaelquigley/push/build.Hash={{.ShortCommit}}
    - -X github.com/michaelquigley/push/build.Date={{.Date}}
    - -X github.com/michaelquigley/push/build.Builder=goreleaser
    - -X github.com/michaelquigley/push/build.Branch={{.Branch}}
    - -X github.com/michaelquigley/push/build.CGO=0
  env:
    - CGO_ENABLED=0
  goos:
    - windows
  goarch:
    - amd64

- id: mcp-bridge-windows
  main: ./cmd/mcp-bridge
  binary: mcp-bridge
  ldflags:
    - -s -w
    - -X github.com/michaelquigley/push/build.Version={{.Tag}}
    - -X github.com/michaelquigley/push/build.Hash={{.ShortCommit}}
    - -X github.com/michaelquigley/push/build.Date={{.Date}}
    - -X github.com/michaelquigley/push/build.Builder=goreleaser
    - -X github.com/michaelquigley/push/build.Branch={{.Branch}}
    - -X github.com/michaelquigley/push/build.CGO=0
  env:
    - CGO_ENABLED=0
  goos:
    - windows
  goarch:
    - amd64

- id: mcp-tools-windows
  main: ./cmd/mcp-tools
  binary: mcp-tools
  ldflags:
    - -s -w
    - -X github.com/michaelquigley/push/build.Version={{.Tag}}
    - -X github.com/michaelquigley/push/build.Hash={{.ShortCommit}}
    - -X github.com/michaelquigley/push/build.Date={{.Date}}
    - -X github.com/michaelquigley/push/build.Builder=goreleaser
    - -X github.com/michaelquigley/push/build.Branch={{.Branch}}
    - -X github.com/michaelquigley/push/build.CGO=0
  env:
    - CGO_ENABLED=0
  goos:
    - windows
  goarch:
    - amd64

- id: mcp-filesystem-windows
  main: ./cmd/mcp-filesystem
  binary: mcp-filesystem
  ldflags:
    - -s -w
    - -X github.com/michaelquigley/push/build.Version={{.Tag}}
    - -X github.com/michaelquigley/push/build.Hash={{.ShortCommit}}
    - -X github.com/michaelquigley/push/build.Date={{.Date}}
    - -X github.com/michaelquigley/push/build.Builder=goreleaser
    - -X github.com/michaelquigley/push/build.Branch={{.Branch}}
    - -X github.com/michaelquigley/push/build.CGO=0
  env:
    - CGO_ENABLED=0
  goos:
    - windows
  goarch:
    - amd64
